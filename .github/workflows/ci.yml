name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Demo smoke test (SYNTHETIC data, no network)
        run: |
          hostop run-all --demo
          hostop insights --demo
          test -f reports/SYNTHETIC_weekly_report.md

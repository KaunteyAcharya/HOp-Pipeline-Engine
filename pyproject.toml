[project]
name = "hostop-pipeline"
version = "0.1.0"
description = "HostOp Pipeline Engine: human-reviewed outbound system for STR operators (never sends automatically)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "pandas>=2.2",
  "beautifulsoup4>=4.12",
  "dnspython>=2.6",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.33",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "pandas-stubs", "types-beautifulsoup4", "respx>=0.21"]

[project.scripts]
hostop = "hostop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hostop"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/hostop/cli.py" = ["B008"]  # typer.Option/Argument defaults are the Typer idiom

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
packages = ["hostop"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

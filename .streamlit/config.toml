[theme]
base = "light"
primaryColor = "#2F6F5E"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#F4F4F2"
textColor = "#18181B"
linkColor = "#2F6F5E"
borderColor = "#E7E5E4"
showWidgetBorder = true
baseRadius = "6px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
